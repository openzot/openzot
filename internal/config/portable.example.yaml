# Portable configuration - compiled INTO the binary.
#
# Copy this file to internal/config/portable.yaml, fill it in, and build with:
#
#   go build -tags portable ./cmd/zot
#
# The resulting binary carries this configuration inside it. It is layered ON
# TOP of the runtime config file and environment, so every field you set here is
# authoritative: the deployment environment cannot override it. Fields you leave
# out still fall through to the config file, the environment, and the built-in
# defaults - so you can bake the model and backend but still take the key from
# the environment, if that is what you want.
#
# See docs/portable-config.md for the full recipe and the trade-offs. In short:
#   + one self-contained artifact - no config file to ship, nothing to set at
#     the destination, nothing there that can redirect it
#   - a baked key is extractable from the binary with `strings`; treat the
#     artifact as the secret, and rebuild to rotate
#
# This is the SAME schema as configs/zot.example.yaml - only the layering and
# the fact that it lives in the binary differ. Delete the fields you do not want
# to pin.

agent:
  # Bake the model/backend pair so the binary runs one specific configuration.
  model: 'glm-5.2'

# Pin which backend a run targets when --backend is not given.
default_backend: zai

backends:
  # Bake a credential to make the binary fully self-contained (no key needed at
  # the destination). Anything you write here is compiled in verbatim.
  zai:
    api_key: 'sk-...'

  # A $ENV_VAR reference is compiled in as the reference, NOT its current value:
  # the binary still reads the variable at runtime. Use this to bake the model
  # and backend while leaving the key to the environment.
  # openai:
  #   api_key: '$OPENAI_API_KEY'
