# Safe fixture configuration for developing the zotui web command center.
# It contains no credentials. Runs execute in ephemeral Docker containers; the
# current checkout's committed Git refs are copied and cloned into /workspace.
repos:
  openzot:
    type: local
    path: $ZOTUI_REPO_PATH
    repositories:
      - openzot/openzot

compute:
  development:
    type: docker

providers:
  zai:
    api_key: $ZAI_API_KEY

environments:
  go-development:
    compute: development
    provider: zai
    model: glm-5.2
    env:
      GOFLAGS: -mod=mod
    repositories:
      - openzot/openzot/openzot

store:
  driver: sqlite
  dsn: $ZOTUI_STORE_DSN
