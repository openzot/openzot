# zotui configuration.
#
# zotui is the browser command center over the zot engine. You define reusable
# workers, start or schedule runs on remote environments, and inspect their output.
# Workers and run history are durable, so closing the browser loses no state.
# Full setup guide: docs/zotui-configuration.md

# Repos are the repository connections workers get their code from and how zotui
# mints per-run credentials. A map, so several connect at once: multiple GitHub
# orgs, GitHub and GitLab together, self-hosted instances. `type` picks the
# implementation; a worker names which repo connection it targets. Each repo has an
# OPTIONAL lockdown - omit to discover every repository it exposes, or list some
# to restrict to those.
repos:
  # A fixed list of public GitHub repositories needs no credential. This is the
  # simplest remote connection for testing Vercel Sandbox compute.
  public:
    type: github
    repositories:
      - openzot/openzot

  acme:
    type: github
    app_id: 123456
    installation_id: 7654321
    # PEM private key, inline or a $VAR reference. Held only on the host - never
    # sent to a sandbox. zotui mints a short-lived, repo-scoped token per run.
    private_key: $ACME_GITHUB_APP_KEY
    # repositories:            # optional per-repo lockdown (owner/name)
    #   - acme-corp/api

  labs:
    type: gitlab
    base_url: https://gitlab.example.com
    token: $LABS_GITLAB_TOKEN

  # A checkout already present on the zotui host. Docker compute copies its
  # committed Git refs as a bundle and clones them into an isolated /workspace.
  # It does not mount the host checkout or mint a remote credential.
  # development:
  #   type: local
  #   path: $ZOTUI_REPO_PATH
  #   repositories:
  #     - openzot/openzot

# Compute is where computers and sandboxes come from. Docker provides local
# ephemeral compute. Vercel boots an ephemeral Vercel Sandbox and checks out a
# remote repo into it.
compute:
  local:
    type: docker
  vercel:
    type: vercel
    # A Vercel access token created in Account Settings. The team and project
    # IDs are shown in the project's Settings page.
    token: $VERCEL_TOKEN
    team_id: $VERCEL_TEAM_ID
    project_id: $VERCEL_PROJECT_ID
    # Defaults to the Hobby-plan maximum. Pro/Enterprise can use up to 24h.
    timeout: 45m

# Inference providers are reusable connections. The map key is also the Zot
# driver unless `driver` says otherwise, which lets an alias such as `corporate`
# use the `openai` driver. Credentials stay on the host and are injected into a
# run's sandbox.
providers:
  zai:
    api_key: $ZAI_API_KEY
    # `models` is optional for built-in providers. When omitted, ZotUI shows
    # Z.AI models from its built-in catalogue.
  anthropic:
    api_key: $ANTHROPIC_API_KEY
    # A custom list replaces the built-in list for this connection. Map keys are
    # the names shown in the UI; `model` may alias the provider's real model ID.
    models:
      sonnet:
        model: claude-5-sonnet

# Environments bind compute to runtime settings - the reusable blueprint a run's
# sandbox is created from: define once, spawn many ephemeral sandboxes. Omit
# `image` for Zotui's standard environment, or set it as a compute-specific
# custom-image override.
# `provider` and `model` are the defaults for workers on this environment.
environments:
  # local-development:
  #   compute: local
  #   provider: zai
  #   model: glm-5.2
  #   # Optional Docker override; Zotui installs Zot at run time.
  #   # image: golang:1.26.6-bookworm
  #   repositories:
  #     - development/openzot/openzot
  # vercel-development:
  #   compute: vercel
  #   provider: zai
  #   model: glm-5.2
  #   # Optional Vercel override; it must be in this project's Vercel Container
  #   # Registry. With no image, Vercel uses its managed default image.
  #   # image: go-environment:latest
  #   repositories:
  #     - public/openzot/openzot
  go-ubuntu:
    compute: local
    provider: zai
    model: glm-5.2
    env:
      GOFLAGS: -mod=mod
    # Optional per-environment lockdown: restrict this environment to specific
    # repositories, qualified as "repo/owner/name". Omit to allow any.
    # repositories:
    #   - acme/acme-corp/api

# Where workers, their run history, and output are stored, so you can close the
# browser and return later without losing state. sqlite by default;
# postgres and others can slot in.
store:
  driver: sqlite
  dsn: ~/.local/state/zotui/zotui.db
