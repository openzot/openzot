# zotui configuration.
#
# zotui is the command center over the zot engine: you schedule a coding job onto
# an ephemeral sandbox, then close the tool and come back later to see how it went.
# Progress is tracked in a store, so the tool is a view over durable state - not a
# process you have to babysit.
#
# The TUI and the (future) web interface both read THIS file. One config, two faces.

# Repository providers - where jobs get their code and how zotui mints per-job
# credentials. A map, so several connect at once: multiple GitHub orgs, GitHub and
# GitLab together, self-hosted instances. `type` picks the implementation; a job
# names which source it targets (--source). Each source has an OPTIONAL lockdown -
# omit to discover every repository it exposes, or list some to restrict to those.
sources:
  acme:
    type: github
    app_id: 123456
    installation_id: 7654321
    # PEM private key, inline or a $VAR reference. Held only on the host - never
    # sent to a sandbox. zotui mints a short-lived, repo-scoped token per job.
    private_key: $ACME_GITHUB_APP_KEY
    # repositories:            # optional per-source lockdown (owner/name)
    #   - acme-corp/api

  labs:
    type: gitlab
    base_url: https://gitlab.example.com
    token: $LABS_GITLAB_TOKEN

# Runners are compute providers - where sandboxes come from. Today: cloudflare.
# Later: vercel, and your own machines over ssh.
runners:
  cf:
    type: cloudflare
    account_id: $CLOUDFLARE_ACCOUNT_ID
    api_token: $CLOUDFLARE_API_TOKEN

# Models zot reasons with. Each names the provider, the model, and the credential
# to reach it - held on the host and injected into a job's sandbox at dispatch. An
# environment picks a default; a job can override it with --model at runtime.
models:
  glm:
    provider: zai
    model: glm-5.2
    api_key: $ZAI_API_KEY
  sonnet:
    provider: anthropic
    model: claude-5-sonnet
    api_key: $ANTHROPIC_API_KEY

# Environments bind a runner to a base image and env vars - the reusable blueprint
# a job's sandbox is created from: define once, spawn many ephemeral sandboxes.
# `model` is the default model for jobs here; --model overrides it per run.
environments:
  go-ubuntu:
    runner: cf
    model: glm
    image: ghcr.io/openzot/openzot-toolchain:latest # base image: toolchain + the zot binary
    env:
      GOFLAGS: -mod=mod
    # Optional per-environment lockdown: restrict this environment to specific
    # repositories, source-qualified as "source/owner/repo". Omit to allow any.
    # repositories:
    #   - acme/acme-corp/api

# Where scheduled jobs and their progress are stored, so you can schedule, close
# the tool, and reopen later to see where a job got to. sqlite by default;
# postgres and others can slot in.
store:
  driver: sqlite
  dsn: ~/.local/state/zotui/zotui.db
