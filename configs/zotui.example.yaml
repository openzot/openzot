# zotui configuration.
#
# zotui is the browser command center over the zot engine. You define reusable
# workers, start or schedule runs on remote environments, and inspect their output.
# Workers and run history are durable, so closing the browser loses no state.
# Full setup guide: docs/zotui-configuration.md

# Repos are the repository connections workers get their code from and how zotui
# mints per-run credentials. A map, so several connect at once: multiple GitHub
# orgs, GitHub and GitLab together, self-hosted instances. `type` picks the
# implementation; a worker names which repo connection it targets. Each repo has an
# OPTIONAL lockdown - omit to discover every repository it exposes, or list some
# to restrict to those.
repos:
  # A fixed list of public GitHub repositories needs no credential. This is the
  # simplest remote connection for testing Vercel Sandbox compute.
  public:
    type: github
    repositories:
      - openzot/openzot

  acme:
    type: github
    app_id: 123456
    installation_id: 7654321
    # PEM private key, inline or a $VAR reference. Held only on the host - never
    # sent to a sandbox. zotui mints a short-lived, repo-scoped token per run.
    private_key: $ACME_GITHUB_APP_KEY
    # repositories:            # optional per-repo lockdown (owner/name)
    #   - acme-corp/api

  labs:
    type: gitlab
    base_url: https://gitlab.example.com
    token: $LABS_GITLAB_TOKEN

  # A checkout already present on the zotui host. Docker compute mounts it into
  # the worker container at /workspace and does not mint a remote credential.
  # development:
  #   type: local
  #   path: $ZOTUI_REPO_PATH
  #   repositories:
  #     - openzot/openzot

# Compute is where computers and sandboxes come from. Docker provides local
# ephemeral compute. Vercel boots an ephemeral Vercel Sandbox from an image in
# the project's Vercel Container Registry and checks out a remote repo into it.
compute:
  local:
    type: docker
  vercel:
    type: vercel
    # A Vercel access token created in Account Settings. The team and project
    # IDs are shown in the project's Settings page.
    token: $VERCEL_TOKEN
    team_id: $VERCEL_TEAM_ID
    project_id: $VERCEL_PROJECT_ID
    # Defaults to the Hobby-plan maximum. Pro/Enterprise can use up to 24h.
    timeout: 45m
  cf:
    type: cloudflare
    account_id: $CLOUDFLARE_ACCOUNT_ID
    api_token: $CLOUDFLARE_API_TOKEN

# Models zot reasons with. Each names the provider, the model, and the credential
# to reach it - held on the host and injected into a run's sandbox. An environment
# picks a default; a worker can override it.
models:
  glm:
    provider: zai
    model: glm-5.2
    api_key: $ZAI_API_KEY
  sonnet:
    provider: anthropic
    model: claude-5-sonnet
    api_key: $ANTHROPIC_API_KEY

# Environments bind compute to a base image and env vars - the reusable blueprint
# a run's sandbox is created from: define once, spawn many ephemeral sandboxes.
# `model` is the default model for workers on this environment.
environments:
  # local-development:
  #   compute: local
  #   model: glm
  #   # Environment image: toolchain only. Zotui installs Zot at run time.
  #   image: golang:1.26.5-bookworm
  #   repositories:
  #     - development/openzot/openzot
  # vercel-development:
  #   compute: vercel
  #   model: glm
  #   # Custom toolchain images must be pushed to this project's Vercel Container
  #   # Registry. Zotui installs its embedded Zot worker after creating the sandbox.
  #   image: go-environment:latest
  #   repositories:
  #     - public/openzot/openzot
  go-ubuntu:
    compute: cf
    model: glm
    image: ghcr.io/acme/go-environment:latest # environment tools; Zot is deployed by zotui
    env:
      GOFLAGS: -mod=mod
    # Optional per-environment lockdown: restrict this environment to specific
    # repositories, qualified as "repo/owner/name". Omit to allow any.
    # repositories:
    #   - acme/acme-corp/api

# Where workers, their run history, and output are stored, so you can close the
# browser and return later without losing state. sqlite by default;
# postgres and others can slot in.
store:
  driver: sqlite
  dsn: ~/.local/state/zotui/zotui.db
