# zot configuration.
#
# Every field is optional - zot runs with built-in defaults when no config file
# is present. Copy this file to ~/.config/zot/config.yaml (or pass it with
# --config) and adjust as needed.
#
# ENVIRONMENT VARIABLES (no file required - ideal for containers/CI):
# Every scalar field below has a matching env var, ZOT_<PATH>, where PATH is the
# field's path upper-cased with dots as underscores. Env vars override the file.
#   agent.model           -> ZOT_AGENT_MODEL
#   agent.max_iterations  -> ZOT_AGENT_MAX_ITERATIONS
#   agent.max_settles     -> ZOT_AGENT_MAX_SETTLES
#   agent.max_calls       -> ZOT_AGENT_MAX_CALLS
#   agent.max_time        -> ZOT_AGENT_MAX_TIME
#   agent.max_tokens      -> ZOT_AGENT_MAX_TOKENS
#   agent.max_continuations -> ZOT_AGENT_MAX_CONTINUATIONS
#   agent.max_recoveries  -> ZOT_AGENT_MAX_RECOVERIES
#   agent.max_cycles      -> ZOT_AGENT_MAX_CYCLES
#   agent.max_empties     -> ZOT_AGENT_MAX_EMPTIES
#   agent.context_strategy -> ZOT_AGENT_CONTEXT_STRATEGY
#   ui.plain              -> ZOT_UI_PLAIN
#   ui.color              -> ZOT_UI_COLOR
#   ui.scrollback         -> ZOT_UI_SCROLLBACK
#   default_provider       -> ZOT_DEFAULT_PROVIDER
#   attribution.name      -> ZOT_ATTRIBUTION_NAME
#   attribution.url       -> ZOT_ATTRIBUTION_URL
#   attribution.disabled  -> ZOT_ATTRIBUTION_DISABLED
#
# Credentials: put the key DIRECTLY in this file, or reference an environment
# variable with $VAR - either works. Each built-in provider also reads its
# provider's conventional variable, so exporting that is usually enough:
#   openai     -> OPENAI_API_KEY          anthropic  -> ANTHROPIC_API_KEY
#   groq       -> GROQ_API_KEY            mistral    -> MISTRAL_API_KEY
#   deepseek   -> DEEPSEEK_API_KEY        openrouter -> OPENROUTER_API_KEY
#   together   -> TOGETHER_API_KEY        cerebras   -> CEREBRAS_API_KEY
#   xai        -> XAI_API_KEY             moonshot   -> MOONSHOT_API_KEY
#   zai        -> ZAI_API_KEY             qwen       -> DASHSCOPE_API_KEY
#   vercel     -> AI_GATEWAY_API_KEY     ollama     -> none (local)

agent:
  # Model name that drives the agent, as the selected provider names it. zot
  # works well across open models (glm-5.2, kimi-k3, deepseek-v4-flash) and top
  # coding models from OpenAI and Anthropic (gpt-5.4-mini, claude-5-sonnet).
  #
  # Whatever you pick, make sure default_provider below actually serves it. A
  # model and a provider that cannot talk to each other fail as a provider error
  # rather than a configuration one, which is much harder to read.
  model: "glm-5.2"

  # The one finite backstop on run length: the maximum number of plan/act/observe
  # cycles before the agent is forced to stop. Tool calls and time are unbounded
  # by default (see below); this is not.
  max_iterations: 1000000

  # A run ends only when the agent records an outcome, by calling the success or
  # failure tool - never because its prose sounds finished. max_settles is how
  # many times the agent is nudged to do so before the run is surfaced as
  # unsettled: how hard zot pushes the model to finish properly. Default 20.
  # max_settles: 20

  # Cap on the total number of tool calls across a run, independent of
  # iterations (one iteration can request several). Unbounded unless you set it -
  # max_iterations is the only finite default backstop.
  # max_calls: 5000

  # Cap on the wall-clock time of a run, as a duration ("30m", "2h", "90s").
  # Checked at each step, so a run stops soon after the deadline. Unbounded
  # unless you set it.
  # max_time: '30m'

  # Cap on the output tokens of a single model response. Unbounded unless you set
  # it - zot sends no limit, so the model produces its full output. Set it to
  # bound response length or per-turn cost.
  # max_tokens: 8192

  # Cap on the bytes a single tool result (a file read, a command's output) may
  # return before it is truncated. Default 100000. Lower it for a model served
  # by an endpoint with a small context window, where one large result can
  # overflow the whole request and be rejected outright.
  # max_tool_output: 32000

  # The safety guards below rarely need touching - each default encodes a real
  # failure mode, so raise or lower them with care. Unlike calls and time, these
  # cannot be turned off; zero just means "use the default".
  #
  # Recovery attempts in a row - a truncated response, or a retriable provider
  # error - with no good turn between them. A turn that comes back whole resets
  # the count. Default 20.
  # max_continuations: 20
  #
  # Recovery attempts across the whole run, however they are spaced. Where
  # max_continuations catches a provider refusing right now, this catches one
  # that answers just often enough to keep resetting it while the run spends its
  # life retrying rather than working. Default 200.
  # max_recoveries: 200
  #
  # How many times the loop nudges the model out of a detected repetition before
  # giving up on it. Default 2.
  # max_cycles: 2
  #
  # Consecutive turns producing neither text nor a tool call before the run
  # bails. Default 3.
  # max_empties: 3

  # As a run approaches a bounded limit (iterations, calls, time), the model is
  # told at each of these percentages - once each - so it can pace itself and
  # finish before the hard stop rather than being cut off mid-task. Default
  # [50, 80, 90]. Set to [] to turn the notices off. (Config file only - a list
  # has no single environment variable.)
  # limit_checkpoints: [50, 80, 90]

  # What happens as the conversation approaches the model's context window:
  #   compact  - summarise the older history into a checkpoint (one extra model
  #              call, so the run keeps a condensed memory of its early turns)
  #   truncate - drop the oldest messages to fit (no extra call, but early
  #              context is lost rather than summarised)
  # Default: compact.
  # context_strategy: compact

  # Tuning for the compact strategy (ignored under truncate). Each zero uses the
  # default. Compaction fires once the provider's reported input usage crosses
  # compact_trigger_ratio of the window AND clears both floors - summarising a
  # short thread costs more than carrying it whole.
  # compact_trigger_ratio: 0.9   # fraction of the window at which to compact
  # compact_min_tokens: 50000    # don't compact below this input-token size
  # compact_min_messages: 20     # ...or below this many summarisable messages
  #
  # Note: the 50000 default is larger than some models' whole context window, so
  # on a small-window model compaction never fires and the run effectively falls
  # back to truncation. Lower compact_min_tokens (e.g. to a fraction of the
  # window) to compact on such a model.

  # Optional override of the built-in system prompt. Leave blank to use the
  # default fully-autonomous instructions. Whatever you put here, zot's
  # non-interactive contract - never wait for input, end only by recording an
  # outcome - is appended to it: a run has no input channel to ask through.
  # instructions: ''

# Presentation. Diff, plain, and color are also command-line flags.
ui:
  # Show a syntax-highlighted before/after diff under each write.
  # diff: false

  # Force unstyled output instead of the full-screen viewer. Without a terminal
  # Zot streams automatically, so an ordinary pipeline needs no flag.
  # plain: false

  # ANSI styling for a non-interactive stream: auto, always, or never. Auto is
  # deliberately plain for pipes and CI; use always for an ANSI-aware log
  # renderer such as wterm. This does not enable keyboard interaction.
  # color: auto

  # How many log lines the full-screen viewer keeps on screen. Default 5000;
  # raise it to keep more of a long run in the scrollback (at more memory). The
  # full, untrimmed run is always in the session log regardless.
  # scrollback: 5000

  # Which fields the header stats bar shows, and in what order. Valid fields:
  # model, provider, dir, iter, tools, edits, elapsed, tokens (default: all).
  # `tokens` shows the provider's own reported usage; iter/tools/elapsed show
  # progress against a limit (e.g. 5/1000) when one is set.
  # (Config file only - a list has no single environment variable.)
  # stats: [model, provider, iter, tools, elapsed, tokens]

# Providers are the named inference connections a run can target. They may be
# direct model services, local servers, or gateways. Pick one per run with
# --provider; otherwise default_provider is used.
#
# A provider named after a built-in driver needs no further configuration: the
# driver is inferred from the name and the credential comes from its conventional
# environment variable. Its `models` block is optional too: omit it to use any
# model (with catalogued models providing known capabilities), or define it as a
# custom allowlist of aliases for this connection.
# How zot names itself to a gateway that ranks the apps calling it - OpenRouter's
# site rankings, the Vercel AI Gateway leaderboards. Both read the same two
# headers (HTTP-Referer, X-Title) and both ignore them if absent.
#
# Nothing about you or the run travels with this: it is zot's own name and
# project URL, identical for every zot in the world, and it is sent only to those
# two gateways - never to a first-party API, which would learn which tool is
# calling for no benefit to anyone. Set `name`/`url` to attribute a tool built on
# zot instead, or `disabled: true` to send nothing. A header you set yourself
# under `providers.<name>` wins over all of this.
# attribution:
#   name: zot
#   url: https://github.com/openzot/openzot
#   disabled: false

default_provider: zai

providers:
  # The default, paired with the default model above: glm-5.2 served by Z.AI.
  # The common case is nothing here at all, and ZAI_API_KEY in the environment.
  zai:
    # api_key: '$ZAI_API_KEY'

  # Any other provider works the same way.
  openai:
    # api_key: '$OPENAI_API_KEY'

  anthropic:
    # api_key: '$ANTHROPIC_API_KEY'

  # On OpenAI, reasoning models use the Responses API automatically: it carries
  # reasoning state between tool rounds, which chat-completions cannot.

  # A local model needs no key.
  ollama:
    # base_url: 'http://localhost:11434/v1'

  # Model gateways - one endpoint fronting many providers, addressed by a
  # provider-qualified model name like 'openai/gpt-5.4' or 'anthropic/claude-5-sonnet'
  # passed to --model. These two have a fixed endpoint, so the key is all they need.
  openrouter:
    # api_key: '$OPENROUTER_API_KEY'

  vercel:
    # api_key: '$AI_GATEWAY_API_KEY'

  # The Cloudflare AI Gateway is also a gateway, but its URL carries your account
  # and gateway ids, so there is no fixed endpoint - name the provider and give
  # the compat URL. The key is the downstream provider's.
  cloudflare:
  #   base_url: 'https://gateway.ai.cloudflare.com/v1/<account>/<gateway>/compat'
  #   api_key: '$OPENAI_API_KEY'

  # Anything else that speaks the OpenAI chat-completions API. A custom endpoint
  # must be https (unless loopback) and needs its own key: zot will not forward a
  # credential issued for one host to another.
  # mygateway:
  #   driver: custom
  #   base_url: 'https://gateway.internal.example.com/v1'
  #   api_key: '$GATEWAY_KEY'
  #
  #   # Optional custom model list. When present, --model must name one of these
  #   # keys. Each entry can alias the provider's real model ID and override its
  #   # run settings. Omit the block to use the built-in catalogue or a new model
  #   # Zot has not catalogued yet.
  #   models:
  #     fast:
  #       model: 'gpt-5.4-mini'
  #       max_iterations: 50
  #       # real context window of the serving endpoint, in tokens - the escape
  #       # hatch for a model whose endpoint ceiling is smaller than its card
  #       # (compaction then fires before the endpoint rejects the request)
  #       context: 32000
