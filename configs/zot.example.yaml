# zot configuration.
#
# Every field is optional - zot runs with built-in defaults when no config file
# is present. Copy this file to ~/.config/zot/config.yaml (or pass it with
# --config) and adjust as needed.
#
# ENVIRONMENT VARIABLES (no file required - ideal for containers/CI):
# Every scalar field below has a matching env var, ZOT_<PATH>, where PATH is the
# field's path upper-cased with dots as underscores. Env vars override the file.
#   agent.model           -> ZOT_AGENT_MODEL
#   agent.max_iterations  -> ZOT_AGENT_MAX_ITERATIONS
#   ui.plain              -> ZOT_UI_PLAIN
#   default_backend       -> ZOT_DEFAULT_BACKEND
#
# Credentials: put the key DIRECTLY in this file, or reference an environment
# variable with $VAR - either works. Each built-in backend also reads its
# provider's conventional variable, so exporting that is usually enough:
#   openai     -> OPENAI_API_KEY          anthropic  -> ANTHROPIC_API_KEY
#   groq       -> GROQ_API_KEY            mistral    -> MISTRAL_API_KEY
#   deepseek   -> DEEPSEEK_API_KEY        openrouter -> OPENROUTER_API_KEY
#   together   -> TOGETHER_API_KEY        cerebras   -> CEREBRAS_API_KEY
#   xai        -> XAI_API_KEY             moonshot   -> MOONSHOT_API_KEY
#   zai        -> ZAI_API_KEY             qwen       -> DASHSCOPE_API_KEY
#   ollama     -> none (local)

agent:
  # Model name that drives the agent, as the selected provider names it. zot
  # works well across open models (glm-5.2, kimi-k3, deepseek-v4-flash) and top
  # coding models from OpenAI and Anthropic (gpt-5.4-mini, claude-5-sonnet).
  #
  # Whatever you pick, make sure default_backend below actually serves it. A
  # model and a backend that cannot talk to each other fail as a provider error
  # rather than a configuration one, which is much harder to read.
  model: 'glm-5.2'

  # Safety cap on plan/act/observe cycles before the agent is forced to stop.
  max_iterations: 1000000

  # Optional override of the built-in system instruction. Leave blank to use the
  # default fully-autonomous backstory.
  # backstory: ''

# Presentation. Both are also flags: --diff and --plain.
ui:
  # Show a syntax-highlighted before/after diff under each write.
  # diff: false

  # Stream unstyled output instead of the full-screen viewer. Auto-enabled when
  # stdout is not a terminal, so a pipeline needs no flag.
  # plain: false

# Backends are the providers a run can target. zot talks to each one directly
# over the OpenAI-compatible chat-completions API - there is no gateway and no
# account in between. Pick one per run with --backend; otherwise default_backend
# is used.
#
# A backend named after a provider needs no further configuration: the name is
# the provider, and the credential comes from its conventional variable.
default_backend: zai

backends:
  # The default, paired with the default model above: glm-5.2 served by Z.AI.
  # The common case is nothing here at all, and ZAI_API_KEY in the environment.
  zai:
    # api_key: '$ZAI_API_KEY'

  # Any other provider works the same way.
  openai:
    # api_key: '$OPENAI_API_KEY'

  anthropic:
    # api_key: '$ANTHROPIC_API_KEY'

  # On OpenAI, reasoning models use the Responses API automatically: it carries
  # reasoning state between tool rounds, which chat-completions cannot. Force it
  # either way if a gateway needs you to.
  #   use_responses: true
  #   disable_responses: true

  # A local model needs no key.
  ollama:
    # base_url: 'http://localhost:11434/v1'

  # Anything else that speaks the OpenAI chat-completions API. A custom endpoint
  # must be https (unless loopback) and needs its own key: zot will not forward a
  # credential issued for one host to another.
  # mygateway:
  #   provider: custom
  #   base_url: 'https://gateway.internal.example.com/v1'
  #   api_key: '$GATEWAY_KEY'
  #
  #   # Named model configurations. A run whose --model matches a key here picks
  #   # up that entry's settings - handy for aliasing, or for pointing one model
  #   # at a different provider.
  #   models:
  #     fast:
  #       model: 'gpt-5.4-mini'
  #       max_iterations: 50
