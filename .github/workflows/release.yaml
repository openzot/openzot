name: Release

on:
  push:
    tags:
      - 'v*'
  # Dispatched by tag-release.yaml at the new tag ref. Needed because tags
  # pushed with GITHUB_TOKEN do not trigger the push-tags event above.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  # Guard: the pushed tag must match the VERSION file and CHANGELOG.md must carry
  # a matching section (release notes are extracted from its top-most entry).
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag, VERSION and CHANGELOG
        run: |
          VERSION="$(cat VERSION)"
          echo "VERSION file: ${VERSION}"
          echo "Tag:          ${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION file (expected v${VERSION})"
            exit 1
          fi
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"
            exit 1
          fi

  release:
    needs: validate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X github.com/openzot/openzot/internal/version.Version=${VERSION}"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

          OUTDIR="dist/zot-${VERSION}-${GOOS}-${GOARCH}"
          mkdir -p "${OUTDIR}"

          for cmd in zot; do
            echo "Building ${cmd}..."
            go build -trimpath -ldflags "${LDFLAGS}" -o "${OUTDIR}/${cmd}${EXT}" "./cmd/${cmd}"
          done

          cp configs/zot.example.yaml "${OUTDIR}/zot.example.yaml"
          cp README.md "${OUTDIR}/README.md"

          tar -czf "dist/zot-${VERSION}-${GOOS}-${GOARCH}.tar.gz" -C dist "zot-${VERSION}-${GOOS}-${GOARCH}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zot-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz

  image:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=zot
            org.opencontainers.image.description=An autonomous coding agent

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  publish:
    needs:
      - release
      - image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Release notes are the latest section of the curated CHANGELOG.md. Extract
      # everything between the first "## [" version header and the next one, and
      # lead with the container image coordinates.
      - name: Generate release notes
        id: notes
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          {
            echo "content<<CHANGELOG_EOF"
            echo "Container image: \`${IMAGE}:${GITHUB_REF_NAME}\`"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            awk '/^## \[/ { if (seen) exit; seen=1; next } seen { print }' CHANGELOG.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          # Only the platform tarballs are needed for checksums and the release;
          # skip the buildx ".dockerbuild" provenance artifact the image job
          # emits, which is unused here and one more thing to flake on download.
          pattern: zot-v*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.content }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
