name: CI

on:
  push:
    branches:
      - main
      - next
    tags-ignore:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'configs/**'
      - '.github/**'
  pull_request:
    branches:
      - main
      - next
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'configs/**'

permissions:
  contents: read

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # The developer build is gated behind a build tag, so nothing else in this
      # workflow ever compiles it - a break there would surface only when
      # someone ran `make dev` locally.
      - name: Vet (developer build)
        run: go vet -tags dev ./...

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Test
        run: go test ./... -count=1 -race

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/zot

      - name: Build (developer build)
        run: CGO_ENABLED=0 go build -trimpath -tags dev ./cmd/zot

  cross-compile:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          for cmd in zot; do
            go build -trimpath -o "${cmd}${EXT}" "./cmd/${cmd}"
          done

  container:
    name: Build and smoke-test container
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          tags: openzot/zot:ci
          build-args: |
            VERSION=v${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail

          # The version must be stamped, not "dev".
          version="$(docker run --rm openzot/zot:ci --version)"
          echo "$version"
          if ! grep -q "v${{ steps.version.outputs.version }}" <<<"$version"; then
            echo "Image reports unexpected version: $version" >&2
            exit 1
          fi

          # The agent's exec tool needs a usable shell and a writable workspace
          # as the unprivileged image user.
          docker run --rm --entrypoint sh openzot/zot:ci -c '
            set -eu
            test "$(id -u)" = "10001"
            git --version >/dev/null
            bash --version >/dev/null
            test -f /usr/local/share/zot/zot.example.yaml
            cd /workspace && echo probe > probe.txt && cat probe.txt
          '

          echo "zot container is ready"
