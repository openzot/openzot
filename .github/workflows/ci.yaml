name: CI

on:
  push:
    branches:
      - main
      - next
    tags-ignore:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'configs/**'
      - '.github/**'
  pull_request:
    branches:
      - main
      - next
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'configs/**'

permissions:
  contents: read

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # The developer build is gated behind a build tag, so nothing else in this
      # workflow ever compiles it - a break there would surface only when
      # someone ran `make dev` locally.
      - name: Vet (developer build)
        run: go vet -tags dev ./...

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Test
        run: go test ./... -count=1 -race

      # Fail the build if total coverage falls below 90%. Same script as
      # `make cover-check`, so a contributor sees the gate locally before CI.
      - name: Coverage gate
        run: ./scripts/coverage.sh

      - name: Build
        run: make build

      - name: Build (developer build)
        run: make dev

  cross-compile:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -trimpath -o "zot${EXT}" ./cmd/zot

  container:
    name: Build and smoke-test container (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: check

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          push: false
          tags: openzot/zot:ci-${{ matrix.arch }}
          build-args: |
            VERSION=v${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail

          # The version must be stamped, not "dev".
          version="$(docker run --rm --platform linux/${{ matrix.arch }} openzot/zot:ci-${{ matrix.arch }} --version)"
          echo "$version"
          if ! grep -q "v${{ steps.version.outputs.version }}" <<<"$version"; then
            echo "Image reports unexpected version: $version" >&2
            exit 1
          fi

          # The image ships the binary, a usable POSIX shell and a writable
          # workspace as the unprivileged image user - and nothing more.
          docker run --rm --platform linux/${{ matrix.arch }} --entrypoint sh openzot/zot:ci-${{ matrix.arch }} -c '
            set -eu
            test "$(id -u)" = "10001"
            test -x /usr/local/bin/zot
            ! command -v git >/dev/null
            ! command -v rg >/dev/null
            test -f /usr/local/share/zot/zot.example.yaml
            cd /workspace && echo probe > probe.txt && cat probe.txt
          '

          echo "zot container is ready"
